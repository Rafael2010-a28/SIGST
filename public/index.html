<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Conta - SIGST</title>

    <link rel="stylesheet" href="Cadastro.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>

    <div id="sigst">
        <img src="SigstLogo.png" width="250px" id="foto1">
    </div>

    <header class="cabecalho">

        <div>
            <h1 id="nome1">Cadastro de Conta</h1>
        </div>

        <img src="FotoPerfil.png" id="foto2" width="200px">

        <p class="cargo"></p>

        <p id="nome2">Sair da Conta</p>

    </header>


    <!-- NOME -->
    <div id="t1">
        <input type="text" id="nome" placeholder="Nome">
    </div>


    <!-- CPF -->
    <div id="t2">
        <input type="text" id="cpf" placeholder="CPF">
    </div>


    <!-- DATA DE NASCIMENTO -->
    <div id="t3">
        <input type="date" id="dataNascimento">
    </div>


    <!-- E-MAIL -->
    <div id="t4">
        <input type="email" id="email" placeholder="E-mail">
    </div>


    <!-- SENHA -->
    <div id="t5">
        <input type="password" id="senha" placeholder="Senha">
    </div>


    <!-- BOTÃO -->
    <div id="botao">
        <button id="salvar">Salvar</button>
    </div>


    <!-- RODAPÉ -->
    <footer class="rodape">
        <p>©sigst2026. Pagina oficial da empresa.</p>
    </footer>


    <!-- JAVASCRIPT -->
    <script src="cadastro.js"></script>

</body>

</html>
